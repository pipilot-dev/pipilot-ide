name: Build & Release

# Triggered by:
#   - pushing a `v*` tag (e.g. v0.2.0)         → builds + draft release
#   - manual run from the Actions tab          → builds + uploads artifacts
#                                                 (no release created)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create a draft release after build (only when run on a tag commit)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write   # needed to attach artifacts to the GitHub Release

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            forge_args: ''                         # default arch (x64)
            artifact_glob: |
              out/make/**/*.exe
              out/make/**/*.nupkg
              out/make/**/RELEASES
          - os: macos-latest
            label: macos-arm64
            forge_args: '--arch=arm64'
            artifact_glob: |
              out/make/**/*.zip
              out/make/**/*.dmg
          # macOS Intel (macos-13) runners were deprecated by GitHub Actions
          # and now sit in the queue indefinitely. Apple Silicon binaries run
          # on Intel Macs via Rosetta 2 — adequate for v0.1. Add it back as a
          # self-hosted runner or universal binary when there's demand.
          - os: ubuntu-22.04
            label: linux-x64
            forge_args: ''
            artifact_glob: |
              out/make/**/*.deb
              out/make/**/*.rpm
              out/make/**/*.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22.12+ required by @electron/rebuild@4 + node-abi@4. Node 20
          # works (warnings only) but produces noisy CI logs.
          node-version: '22'
          cache: 'npm'

      # Electron's chromium needs a handful of system libraries on linux
      # builders. Pin to ubuntu-22.04 so libasound2 still works (it was
      # renamed to libasound2t64 in 24.04).
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            rpm fakeroot dpkg \
            libnss3 libatk-bridge2.0-0 libdrm2 libxcomposite1 libxdamage1 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2

      # Materialise the runtime .env from GitHub Actions secrets BEFORE
      # forge packs the app — these keys (Codestral, Groq, Cloudflare AI,
      # Preview API) ship in the bundle and power inline AI / voice /
      # cloud-AI features. Anthropic credentials are NOT here — those
      # come from the user's JWT via the auth proxy at runtime.
      #
      # To set the secrets one-time per repo:
      #   gh secret set CODESTRAL_API_KEY  -b "DXfX..."
      #   gh secret set CODESTRAL_HOST     -b "codestral.mistral.ai"
      #   gh secret set CODESTRAL_MODEL    -b "codestral-latest"
      #   gh secret set GROQ_API_KEY       -b "gsk_..."
      #   gh secret set CLOUDFLARE_ACCOUNT_ID -b "01c84f..."
      #   gh secret set CLOUDFLARE_API_TOKEN  -b "cfut_..."
      #   gh secret set VITE_PREVIEW_API_URL  -b "https://pipilot.dev/api/app-preview"
      #   gh secret set VITE_PREVIEW_API_KEY  -b "Bearer ppk_live_..."
      - name: Materialise runtime .env from secrets
        shell: bash
        env:
          CODESTRAL_API_KEY:    ${{ secrets.CODESTRAL_API_KEY }}
          CODESTRAL_HOST:       ${{ secrets.CODESTRAL_HOST }}
          CODESTRAL_MODEL:      ${{ secrets.CODESTRAL_MODEL }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_PREVIEW_API_URL: ${{ secrets.VITE_PREVIEW_API_URL }}
          VITE_PREVIEW_API_KEY: ${{ secrets.VITE_PREVIEW_API_KEY }}
        run: |
          cat > .env <<EOF
          # Auto-generated by CI from GitHub Actions secrets.
          # Anthropic creds come from the user's JWT at runtime — not in here.

          # Inline AI (Codestral)
          CODESTRAL_API_KEY=${CODESTRAL_API_KEY}
          CODESTRAL_HOST=${CODESTRAL_HOST:-codestral.mistral.ai}
          CODESTRAL_MODEL=${CODESTRAL_MODEL:-codestral-latest}

          # Voice input (Groq Whisper)
          GROQ_API_KEY=${GROQ_API_KEY}

          # Cloudflare AI (some IDE tools)
          CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
          CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}

          # Deploy Hub preview server
          VITE_PREVIEW_API_URL=${VITE_PREVIEW_API_URL}
          VITE_PREVIEW_API_KEY=${VITE_PREVIEW_API_KEY}

          # SDK behaviour
          CLAUDE_CODE_REMOTE=true

          # Default model selectors (server-side decides what's actually used)
          ANTHROPIC_DEFAULT_SONNET_MODEL=claude-sonnet-4-6
          ANTHROPIC_DEFAULT_OPUS_MODEL=claude-sonnet-4-6
          ANTHROPIC_DEFAULT_HAIKU_MODEL=claude-sonnet-4-6

          # Playwright headers
          PLAYWRIGHT_BROWSERS_PATH=0
          EOF
          # Sanity log (NEVER print values — only which keys are present).
          echo "[ci] .env written. Keys present:"
          grep -E '^[A-Z_]+=' .env | grep -vE '=$' | sed 's/=.*//' | sed 's/^/  /'

      # Install + skip-or-do native rebuild for node-pty.
      # postinstall handles N-API prebuild detection; see scripts/postinstall.js.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Cache the electron binary download between runs to shave ~30s
      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
            ~/Library/Caches/electron
          key: electron-${{ matrix.os }}-${{ hashFiles('package-lock.json') }}

      # Forge runs packager + the platform makers configured in
      # forge.config.js (squirrel/zip/deb/rpm).
      - name: Build with electron-forge
        run: npm run make -- ${{ matrix.forge_args }}
        env:
          # Skip code-signing if no certs are present (default for OSS builds).
          # Add APPLE_ID / APPLE_ID_PASSWORD / APPLE_TEAM_ID secrets to enable
          # macOS notarisation; CSC_LINK / CSC_KEY_PASSWORD for Windows signing.
          DEBUG: 'electron-forge:*'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipilot-${{ matrix.label }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only create a release when the workflow was triggered by a tag push.
    # Manual workflow_dispatch runs just upload artifacts (above) so you can
    # smoke-test the matrix without polluting Releases.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # We need the repo checked out so the release job can read the
      # hand-written RELEASE_NOTES_<tag>.md file from the tagged commit.
      - name: Checkout (for release notes)
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact tree
        run: |
          mkdir -p release
          find dist -type f \( -name '*.exe' -o -name '*.nupkg' -o -name 'RELEASES' \
                             -o -name '*.dmg' -o -name '*.zip' \
                             -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp -v {} release/ \;
          ls -lah release

      # Pick the right notes file. Prefer a hand-written
      # RELEASE_NOTES_<tag>.md (e.g. RELEASE_NOTES_v0.1.0.md). If none
      # exists, fall back to CHANGELOG.md, then to GitHub's auto-generator.
      - name: Resolve release notes body
        id: notes
        shell: bash
        run: |
          TAG='${{ github.ref_name }}'
          NOTES="RELEASE_NOTES_${TAG}.md"
          if [ -f "$NOTES" ]; then
            echo "body_path=$NOTES" >> "$GITHUB_OUTPUT"
            echo "use_auto=false" >> "$GITHUB_OUTPUT"
            echo "[release] using $NOTES as the release body."
          elif [ -f CHANGELOG.md ]; then
            echo "body_path=CHANGELOG.md" >> "$GITHUB_OUTPUT"
            echo "use_auto=false" >> "$GITHUB_OUTPUT"
            echo "[release] no $NOTES found; using CHANGELOG.md."
          else
            echo "body_path=" >> "$GITHUB_OUTPUT"
            echo "use_auto=true" >> "$GITHUB_OUTPUT"
            echo "[release] no notes file found; falling back to auto-generated."
          fi

      # Note: GitHub auto-attaches "Source code (zip)" and "Source code
      # (tar.gz)" to every Release based on the tag — no work needed here.
      - name: Create / update draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}   # v0.2.0-rc.1 etc
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          # Append the auto-generated commit log only when we don't have
          # a hand-written notes file. Otherwise the file is the source
          # of truth and we don't want GitHub appending duplicate noise.
          generate_release_notes: ${{ steps.notes.outputs.use_auto == 'true' }}
          files: release/*
